# HA-Services-MaintenanceView 部署声明（deploy-manifest v1）
# schema 依据：HA-Services-Deployer internal/manifest/（SchemaVersion=1）
manifest_version: 1
kind: service
project: ha-services-maintenance-view
display_name: HA-Services-MaintenanceView
group: ops
# 未知：仓库无版本 tag，代码与配置均无服务版本字段。
service_version: "unknown"

facts:
  ports:
    # 生产裸金属端口为 2771：代码默认 :2771（internal/models/config.go
    # DefaultConfig，config.example.yaml 同值），生产实测 :2771 /healthz 200
    # （PROD-UPGRADE-EXECUTED-20261106 §7/§10-3）。
    # 漂移记录：容器模板用 :18081（本仓 knowledge 0005 已记录该端口分裂）。
    - name: http
      port: 2771
      exposure: loopback
  health:
    # internal/server/router.go router.GET("/healthz")；compose healthcheck 同路径
    http:
      port_name: http
      path: /healthz
      expect_status: 200
      timeout_seconds: 5
      interval_seconds: 30
      retries: 3
  smoke:
    # 部署后冒烟：会话状态端点（前端判断登录态的入口；注册在鉴权中间件
    # 之前，无需会话，确定性 200；internal/server/auth.go SessionStatus）。
    # 更深的端点（/api/projects 等）在启用鉴权后要求会话 Cookie——会话 ID
    # 进程内随机签发、12h 滑动过期，静态冒烟无法持有，故不越鉴权探测；
    # 项目列表链路改由 deployer 依赖可达性在 preflight 兜底。
    #
    # 断言必须能识破 SPA 静态回退：本服务对未知路径一律回 200 + index.html
    #（server.frontend_dist 托管），旧二进制没有该端点时状态码是回退伪造的。
    # expect_content_type 是第一道闸（回退是 text/html，真实端点是
    # application/json），json_field 再钉住响应契约；两者缺一不可。
    - name: session-status
      method: GET
      path: /api/session
      expect_status: 200
      timeout_seconds: 10
      assert:
        expect_content_type: application/json
        json_field: data.auth_required
  depends_on:
    # deployer.base_url 代理 Deployer 只读面；
    # compose depends_on ha-services-deployer: service_healthy。
    # 无数据库、无 redis（模板无对应段，状态落 data/projects.json）。
    - project: ha-services-deployer
      kind: required
  migration:
    # 无数据库，无迁移机制。
    mode: none
  data_dirs:
    # 模板 state.projects_path: ./data/projects.json
    - ./data
  config:
    # main.go config.Load("config.yaml")。
    # 模板版本 = 模板首行 version: "1"（代码 ConfigVersion 同为 "1"）。
    - path: config.yaml
      template_version: "1"
  # 模板 server.frontend_dist: ./frontend/dist（SPA 托管；
  # 生产在位 /www/wwwroot/hasmv/frontend/，见 PROD-FILEREFRESH §1）。
  static_assets: ./frontend/dist

baremetal:
  process:
    manager: aapanel
  install:
    # PROD-FILEREFRESH-20261107 §1：二进制在位路径 /www/wwwroot/hasmv/hasmv
    root: /www/wwwroot/hasmv
    binary_name: hasmv
  artifact:
    source: local_path
    local_path: /home/lnb/Desktop/HA/maintanance/HA-Services-MaintenanceView/build/hasmv

container:
  enabled: false
  # 容器形态镜像：已真实发布（Docker Hub，build → push → 回拉 → 挂回
  # compose 平台冒烟全过，前端已内嵌构建）。镜像为 linux/amd64 +
  # linux/arm64 多架构 manifest list，digest 钉的是 manifest list 摘要
  #（非单平台子摘要），为生效引用，tag 仅可读别名。
  # 部署时 Deployer 按 digest 优先真实拉取本镜像
  #（鉴权沿用宿主 docker 登录态；拉后摘要对照不符即响亮失败）。
  image:
    source: registry
    repo: limeight/ha-services-maintenance-view
    tag: "4567105"
    digest: "sha256:52ee8d3d1a0af9695f815870b0f25ecbef2e9141c8e65735585750ed414b908a"
